name: Live probe

# GitHub delays scheduled runs. This is not a liveness guarantee.
# The probe fails when the URL is empty. Set REPROOF_DOOR_URL after the door is deployed.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Public judge door URL
        required: true
        type: string
  schedule:
    - cron: "17 15 * * *"

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Probe
        working-directory: web
        env:
          DOOR_URL: ${{ github.event.inputs.url || vars.REPROOF_DOOR_URL }}
        run: node scripts/agent-check.mjs "$DOOR_URL"
