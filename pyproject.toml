[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reproof"
version = "0.1.0"
description = "Maintainer-side reproduction and duplicate triage for public security reports"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "clusterfuzz==2.6.0",
  "contree-sdk==0.3.6",
  "openai>=2.0,<3",
  "pyelftools>=0.32,<1",
  "pydantic>=2.11,<3",
]

[project.scripts]
reproof = "reproof.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.13,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["reproof"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live: requires Nebius credentials and makes paid external requests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
